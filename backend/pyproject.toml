[project]
name = "columbinamath"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "djangorestframework>=3.18",
    "gunicorn>=23",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "python-decouple>=3.8",
    "whitenoise>=6.8",
]

[tool.ruff]
# Pastas geradas automaticamente pelo Django ficam de fora do lint
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Mantém as regras padrão do Ruff e acrescenta:
extend-select = [
    "I",   # ordem dos imports (isort)
    "B",   # bugs prováveis (flake8-bugbear)
    "UP",  # sintaxe moderna do Python (pyupgrade)
    "DJ",  # boas práticas de Django (flake8-django)
    "S",   # problemas de segurança (flake8-bandit)
]
ignore = [
    # Falso positivo no Django: Meta, ModelAdmin e afins são configuração
    # declarativa da classe, não estado compartilhado entre instâncias.
    "RUF012",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]


[tool.ruff.lint.per-file-ignores]
# Nos testes, assert é a ferramenta certa (o pytest depende dele)
"**/tests.py" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
# O WhiteNoise avisa que a pasta do collectstatic não existe; nos testes ela não é usada
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
# Mede todo o código do projeto, não só os arquivos que os testes importam
source = ["."]
omit = [
  "*/migrations/*", # geradas pelo Django
  "*/tests.py",     # os próprios testes
  "manage.py",      # pontos de entrada, sem lógica nossa
  "config/asgi.py",
  "config/wsgi.py",
  "gunicorn.conf.py", # lido pelo Gunicorn, não pelos testes
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# o CI falha se a cobertura cair abaixo deste percentual
fail_under = 90
