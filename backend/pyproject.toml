[project]
name = "columbinamath"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "python-decouple>=3.8",
]

[tool.ruff]
# Pastas geradas automaticamente pelo Django ficam de fora do lint
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Mantém as regras padrão do Ruff e acrescenta:
extend-select = [
    "I",   # ordem dos imports (isort)
    "B",   # bugs prováveis (flake8-bugbear)
    "UP",  # sintaxe moderna do Python (pyupgrade)
    "DJ",  # boas práticas de Django (flake8-django)
    "S",   # problemas de segurança (flake8-bandit)
]
ignore = [
    # Falso positivo no Django: Meta, ModelAdmin e afins são configuração
    # declarativa da classe, não estado compartilhado entre instâncias.
    "RUF012",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
]


[tool.ruff.lint.per-file-ignores]
# Nos testes, assert é a ferramenta certa (o pytest depende dele)
"**/tests.py" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
