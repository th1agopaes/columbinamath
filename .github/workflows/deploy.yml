# Publica o ColumbinaMath no GitHub Pages a cada push na branch main.
# Link: https://th1agopaes.github.io/columbinamath/
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar código (lint)
        run: npm run lint

      - name: Gerar versão final
        run: npm run build -- --base=/columbinamath/

      # O GitHub Pages não conhece as rotas do React. Copiando o index.html
      # para 404.html, abrir um link direto (ex.: /conteudos) também funciona.
      - name: Página de fallback para as rotas
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
