{% extends "base.html" %}

{% block titulo %}Entrar · ColumbinaMath{% endblock %}

{% block conteudo %}
  <h1>Entrar</h1>
  <p class="subtitulo">Entre para resolver exercícios e guardar o seu progresso.</p>

  <form method="post" class="cartao formulario">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="botao" type="submit">Entrar</button>
  </form>

  <p>Ainda não tem conta? <a href="{% url 'usuarios:cadastro' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Crie a sua</a>.</p>
{% endblock %}
